# ============================================================
# score-radar · cjgl.zhangqiang.hk.cn nginx 站点配置
#
# 两阶段部署流程（重要）：
#   第一次部署时，先只保留 server 80 块（把 443 块整段注释掉），
#   用 certbot webroot 方式签发证书：
#
#     sudo mkdir -p /var/www/cjgl-webroot
#     sudo certbot certonly --webroot -w /var/www/cjgl-webroot -d cjgl.zhangqiang.hk.cn
#
#   签发成功后，取消 443 块注释（Let's Encrypt 标准证书路径已写好），
#   再执行：
#
#     sudo nginx -t && sudo systemctl reload nginx
#
#   （也可用 `certbot --nginx -d cjgl.zhangqiang.hk.cn` 令 certbot 自动
#    改写配置，但本文件手动管理更直观，推荐上面的 webroot 方式。）
#
# http2 写法说明：本文件用行内 `listen 443 ssl http2;`（1.11.0 起支持，
# 兼容 Ubuntu 24.04 默认源 nginx 1.24.0 及所有更新版本）。若服务器
# nginx >= 1.25.1，官方更推荐 modern 写法：`listen 443 ssl;` +
# 独立指令 `http2 on;`（1.25.1 起 listen 内 http2 已标记废弃），
# 两种写法二选一即可，不要同时使用。
# ============================================================

# ---------- HTTP:80 — ACME 验证 + 跳转 HTTPS ----------
server {
    listen 80;
    server_name cjgl.zhangqiang.hk.cn;

    # Let's Encrypt http-01 验证路径直接放行（webroot 指向 /var/www/cjgl-webroot）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cjgl-webroot;
        default_type text/plain;
    }

    # 其余全部 301 到 HTTPS
    # （首次签证书阶段若已提前放开此跳转，cert webroot 验证不受影响，
    #   因为上面的 ^~ 前缀匹配优先级更高）
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS:443 — 反代本机 Express ----------
server {
    listen 443 ssl http2;
    server_name cjgl.zhangqiang.hk.cn;

    # Let's Encrypt 标准证书路径（certbot 签发后自动生成）
    ssl_certificate     /etc/letsencrypt/live/cjgl.zhangqiang.hk.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cjgl.zhangqiang.hk.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头（适量即可，避免影响前端正常加载）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Excel 导入等接口的请求体上限
    client_max_body_size 10m;

    # 反代到本机 Express 单进程
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
