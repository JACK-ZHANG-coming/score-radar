# ============================================================
# score-radar 独立实例 · cjglzq.zhangqiang.hk.cn nginx 站点配置
#（与 cjgl.zhangqiang.hk.cn 完全独立：目录/端口/进程/证书互不复用）
#
# 两阶段部署流程（重要）：
#   第一次部署时，先只保留 server 80 块（把 443 块整段注释掉），
#   用 certbot webroot 方式签发证书：
#
#     sudo mkdir -p /var/www/cjglzq-webroot
#     sudo certbot certonly --webroot -w /var/www/cjglzq-webroot -d cjglzq.zhangqiang.hk.cn
#
#   签发成功后，取消 443 块注释，再执行：
#     sudo nginx -t && sudo systemctl reload nginx
#
# http2 写法：行内 `listen 443 ssl http2;`（1.11.0 起支持，兼容
# Ubuntu 24.04 默认源 nginx 1.24.0 及更新版本）。若 nginx >= 1.25.1，
# 可改用 modern 写法 `listen 443 ssl;` + `http2 on;`，二选一勿混用。
# ============================================================

# ---------- HTTP:80 — ACME 验证 + 跳转 HTTPS ----------
server {
    listen 80;
    server_name cjglzq.zhangqiang.hk.cn;

    # Let's Encrypt http-01 验证路径直接放行（webroot 独立目录）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cjglzq-webroot;
        default_type text/plain;
    }

    # 其余全部 301 到 HTTPS（^~ 前缀匹配优先级高于本块，ACME 验证不受影响）
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS:443 — 反代本机独立 Express（127.0.0.1:3001） ----------
server {
    listen 443 ssl http2;
    server_name cjglzq.zhangqiang.hk.cn;

    # Let's Encrypt 标准证书路径（certbot 签发后自动生成）
    ssl_certificate     /etc/letsencrypt/live/cjglzq.zhangqiang.hk.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cjglzq.zhangqiang.hk.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # 反代到本机独立 Express 实例（与 cjgl 的 3000 端口互不相干）
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
